:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {

}

  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);

  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);

  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);

  min-height: 26px;

  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;

.form-control-color[type=&quot;color&quot;] {

  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {

  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,

.form-select:not(:disabled):hover {

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {

  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);

}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;section class=&quot;dmc-section&quot; data-panel=&quot;example&quot;&gt;
    &lt;h2&gt;4. 一个学员实例：从测评到反馈&lt;/h2&gt;
    &lt;p class=&quot;dmc-caption&quot;&gt;以下示例展示编号怎样贯穿六张表。真实系统中靠这些编号关联，而不是靠“月度测评”或“张同学”等可能重复的名称。&lt;/p&gt;
    &lt;div class=&quot;dmc-story&quot;&gt;
      &lt;div class=&quot;dmc-step&quot;&gt;&lt;strong&gt;① 定义测评&lt;/strong&gt;&lt;span&gt;&lt;code&gt;A001&lt;/code&gt; 八月月度测评，总分 100。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;dmc-step&quot;&gt;&lt;strong&gt;② 组织题目&lt;/strong&gt;&lt;span&gt;&lt;code&gt;AQ001&lt;/code&gt; 引用题目 &lt;code&gt;Q017&lt;/code&gt;，本次值 5 分。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;dmc-step&quot;&gt;&lt;strong&gt;③ 学员作答&lt;/strong&gt;&lt;span&gt;学员 &lt;code&gt;S001&lt;/code&gt; 产生作答 &lt;code&gt;T001&lt;/code&gt;，逐题保存答案。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;dmc-step&quot;&gt;&lt;strong&gt;④ 形成反馈&lt;/strong&gt;&lt;span&gt;根据 &lt;code&gt;T001&lt;/code&gt; 生成反馈 &lt;code&gt;F001&lt;/code&gt;，交给家长。&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;dmc-rule&quot;&gt;&lt;strong&gt;完整追溯链：&lt;/strong&gt; 学员 &lt;code&gt;S001&lt;/code&gt; → 测评 &lt;code&gt;A001&lt;/code&gt; → 作答 &lt;code&gt;T001&lt;/code&gt; → 逐题答案 → 能力点 → 反馈 &lt;code&gt;F001&lt;/code&gt;。&lt;/div&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;表&lt;/th&gt;&lt;th&gt;示例记录&lt;/th&gt;&lt;th&gt;这行在现实中表示什么&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;dmc-example&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;h3 class=&quot;dmc-table-title&quot;&gt;这条链能够回答的问题&lt;/h3&gt;
    &lt;ul&gt;
      &lt;li&gt;张同学参加了哪次测评，什么时候提交，最终得分多少？&lt;/li&gt;
      &lt;li&gt;哪道题答错了，这道题考查哪个能力点，错因是什么？&lt;/li&gt;
      &lt;li&gt;某个能力点的掌握度如何计算，和上次相比是否进步？&lt;/li&gt;
      &lt;li&gt;教师向哪位家长反馈了什么，提出了什么行动计划？&lt;/li&gt;
      &lt;li&gt;反馈是否及时，家长续费意向和风险等级是什么？&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/section&gt;

      const checks = [[&#x27;测评总分等于题目分值之和&#x27;,&#x27;assessment.total_score = SUM(assessment_question.score)&#x27;],[&#x27;最终得分等于逐题得分之和&#x27;,&#x27;assessment_attempt.final_score = SUM(student_answer.score_awarded)&#x27;],[&#x27;单题得分不能超过本题分值&#x27;,&#x27;score_awarded ≤ assessment_question.score&#x27;],[&#x27;结束时间不能早于开始时间&#x27;,&#x27;end_time ≥ start_time&#x27;],[&#x27;反馈必须关联有效学员测评&#x27;,&#x27;feedback.attempt_id 外键校验&#x27;],[&#x27;已评分必须有评分时间&#x27;,&#x27;status = 已评分时 graded_at 非空&#x27;]];
      const expansions = [[&#x27;一道题需同时统计多个能力点&#x27;,&#x27;新增 question_skill&#x27;],[&#x27;允许补考或多次尝试&#x27;,&#x27;增加 attempt_no 并调整唯一约束&#x27;],[&#x27;改进任务需要分配、提醒和验收&#x27;,&#x27;新增 improvement_action&#x27;],[&#x27;反馈报告需要版本管理和审批&#x27;,&#x27;拆分 learning_report 与 feedback_communication&#x27;],[&#x27;能力结果计算量过大且需历史快照&#x27;,&#x27;新增 student_skill_snapshot&#x27;],[&#x27;不同场次需要独立地点、时间和监考&#x27;,&#x27;新增 assessment_session&#x27;]];
      const examples = [[&#x27;assessment&#x27;,&#x27;A001｜八月月度测评｜总分100&#x27;,&#x27;机构发布的一套测评规则&#x27;],[&#x27;question&#x27;,&#x27;Q017｜阅读主旨题｜skill=SK03&#x27;,&#x27;题库中可重复使用的一道标准题&#x27;],[&#x27;assessment_question&#x27;,&#x27;AQ001｜A001 + Q017｜5分&#x27;,&#x27;Q017 在 A001 中排第几题、值多少分&#x27;],[&#x27;assessment_attempt&#x27;,&#x27;T001｜A001 + S001｜得分82&#x27;,&#x27;学员 S001 参加 A001 的这一次真实作答&#x27;],[&#x27;student_answer&#x27;,&#x27;AN017｜T001 + AQ001｜得分0｜审题错误&#x27;,&#x27;S001 对 Q017 的最终答案与诊断&#x27;],[&#x27;feedback&#x27;,&#x27;F001｜T001 + G001｜待跟进&#x27;,&#x27;教师基于 T001 向家长 G001 做的一次反馈&#x27;]];

      const row = cells =&gt; `&lt;tr&gt;${cells.map(c =&gt; `&lt;td&gt;${c}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;`;
      root.querySelector(&#x27;#dmc-relations&#x27;).innerHTML = relations.map((r,i) =&gt; row([i+1,...r])).join(&#x27;&#x27;);
      root.querySelector(&#x27;#dmc-metrics&#x27;).innerHTML = metrics.map((r,i) =&gt; row([i+1,...r])).join(&#x27;&#x27;);
      root.querySelector(&#x27;#dmc-checks&#x27;).innerHTML = checks.map((r,i) =&gt; row([i+1,...r])).join(&#x27;&#x27;);
      root.querySelector(&#x27;#dmc-expansions&#x27;).innerHTML = expansions.map((r,i) =&gt; row([i+1,...r])).join(&#x27;&#x27;);
      root.querySelector(&#x27;#dmc-example&#x27;).innerHTML = examples.map(r =&gt; row([`&lt;code&gt;${r[0]}&lt;/code&gt;`,r[1],r[2]])).join(&#x27;&#x27;);
      root.querySelector(&#x27;#dmc-dictionaries&#x27;).innerHTML = tables.map((t,ti) =&gt; `
        &lt;h3 class=&quot;dmc-table-title&quot;&gt;${ti+1}. ${t.cn} &lt;code&gt;${t.name}&lt;/code&gt;&lt;/h3&gt;
        &lt;p class=&quot;dmc-table-grain&quot;&gt;${t.grain}&lt;/p&gt;
        &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;序号&lt;/th&gt;&lt;th&gt;字段&lt;/th&gt;&lt;th&gt;类型&lt;/th&gt;&lt;th&gt;约束&lt;/th&gt;&lt;th&gt;说明&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
          ${t.fields.map((f,i) =&gt; row([i+1,`&lt;code&gt;${f[0]}&lt;/code&gt;`,f[1],`&lt;span class=&quot;${f[2].includes(&#x27;PK&#x27;)?&#x27;dmc-pk&#x27;:f[2].includes(&#x27;FK&#x27;)?&#x27;dmc-fk&#x27;:&#x27;&#x27;}&quot;&gt;${f[2]}&lt;/span&gt;`,f[3]])).join(&#x27;&#x27;)}
        &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`).join(&#x27;&#x27;);

      const detailTitle = root.querySelector(&#x27;#dmc-detail-title&#x27;);
      const detailGrain = root.querySelector(&#x27;#dmc-detail-grain&#x27;);
      const detailList = root.querySelector(&#x27;#dmc-detail-list&#x27;);
      function selectNode(key) {
        const d = nodeDetails[key];
        root.querySelectorAll(&#x27;.dmc-node&#x27;).forEach(n =&gt; n.classList.toggle(&#x27;active&#x27;, n.dataset.node === key));
        detailTitle.textContent = d[0];
        detailGrain.textContent = d[1];
        detailList.replaceChildren(...d[2].map(text =&gt; { const li=document.createElement(&#x27;li&#x27;); li.textContent=text; return li; }));
      }
      root.querySelectorAll(&#x27;.dmc-node&#x27;).forEach(node =&gt; {
        node.setAttribute(&#x27;role&#x27;,&#x27;button&#x27;);
        node.setAttribute(&#x27;aria-label&#x27;,`查看${nodeDetails[node.dataset.node][0]}`);
        node.addEventListener(&#x27;click&#x27;,() =&gt; selectNode(node.dataset.node));
      });
      root.querySelectorAll(&#x27;[data-tab]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;,() =&gt; {
        const tab=button.dataset.tab;
        root.querySelectorAll(&#x27;[data-tab]&#x27;).forEach(b =&gt; { const active=b===button; b.classList.toggle(&#x27;btn-primary&#x27;,active); b.setAttribute(&#x27;aria-selected&#x27;,String(active)); });
        root.querySelectorAll(&#x27;[data-panel]&#x27;).forEach(panel =&gt; panel.classList.toggle(&#x27;dmc-hidden&#x27;,tab!==&#x27;all&#x27; &amp;&amp; panel.dataset.panel!==tab));
        root.querySelectorAll(&#x27;.dmc-edge&#x27;).forEach(edge =&gt; { const active=tab===&#x27;example&#x27; &amp;&amp; [&#x27;assessment-attempt&#x27;,&#x27;attempt-answer&#x27;,&#x27;attempt-feedback&#x27;].includes(edge.dataset.edge); edge.classList.toggle(&#x27;active&#x27;,active); edge.setAttribute(&#x27;marker-end&#x27;,active?&#x27;url(#dmc-arrow-active)&#x27;:&#x27;url(#dmc-arrow)&#x27;); });
        if(tab===&#x27;example&#x27;) selectNode(&#x27;attempt&#x27;);
      }));
      selectNode(&#x27;assessment&#x27;);
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
