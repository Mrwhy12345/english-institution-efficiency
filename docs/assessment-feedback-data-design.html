:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {

}

  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);

  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);

  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);

  min-height: 26px;

  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;

.form-control-color[type=&quot;color&quot;] {

  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {

  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,

.form-select:not(:disabled):hover {

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {

  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);

}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    &lt;h3 class=&quot;dmc-table-title&quot;&gt;关系基数&lt;/h3&gt;

  &lt;section class=&quot;dmc-section&quot; data-panel=&quot;deployment&quot;&gt;
    &lt;h2&gt;2. MySQL部署ER：为什么是18张表&lt;/h2&gt;
    &lt;p class=&quot;dmc-caption&quot;&gt;14张概念表用于理解业务；部署时增加4张物理必需表。没有把招生、订单、课消、排课或财务提前塞进当前版本。&lt;/p&gt;

    &lt;div class=&quot;dmc-deploy-grid&quot;&gt;
      &lt;div class=&quot;dmc-deploy-group&quot;&gt;&lt;strong&gt;结构治理 · 1张&lt;/strong&gt;&lt;code&gt;schema_version&lt;/code&gt;&lt;span class=&quot;text-muted&quot;&gt;只记录数据库结构版本，不属于业务ER。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;dmc-deploy-group&quot;&gt;&lt;strong&gt;客户与组织 · 9张&lt;/strong&gt;&lt;code&gt;family&lt;/code&gt;&lt;code&gt;guardian&lt;/code&gt;&lt;code&gt;student&lt;/code&gt;&lt;code&gt;student_guardian&lt;/code&gt;&lt;code&gt;staff&lt;/code&gt;&lt;code&gt;course&lt;/code&gt;&lt;code&gt;class_group&lt;/code&gt;&lt;code&gt;class_enrollment&lt;/code&gt;&lt;code&gt;skill_point&lt;/code&gt;&lt;/div&gt;
      &lt;div class=&quot;dmc-deploy-group&quot;&gt;&lt;strong&gt;内容与测评 · 7张&lt;/strong&gt;&lt;code&gt;learning_resource&lt;/code&gt;&lt;code&gt;content_unit&lt;/code&gt;&lt;code&gt;question&lt;/code&gt;&lt;code&gt;assessment&lt;/code&gt;&lt;code&gt;assessment_question&lt;/code&gt;&lt;code&gt;assessment_attempt&lt;/code&gt;&lt;code&gt;student_answer&lt;/code&gt;&lt;/div&gt;
      &lt;div class=&quot;dmc-deploy-group&quot;&gt;&lt;strong&gt;反馈闭环 · 1张&lt;/strong&gt;&lt;code&gt;feedback&lt;/code&gt;&lt;span class=&quot;text-muted&quot;&gt;关联学员作业、家长与负责人。&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3 class=&quot;dmc-table-title&quot;&gt;从14张到18张的逐项论证&lt;/h3&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;新增表&lt;/th&gt;&lt;th&gt;一行代表什么&lt;/th&gt;&lt;th&gt;不增加会发生什么&lt;/th&gt;&lt;th&gt;结论&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;&lt;code&gt;family&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一个家庭客户单元&lt;/td&gt;&lt;td&gt;兄弟姐妹的来源、负责人和家庭状态会在学员、家长中重复&lt;/td&gt;&lt;td&gt;保留，业务主数据&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;code&gt;student_guardian&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一名学员与一名家长的一种关系&lt;/td&gt;&lt;td&gt;无法表达多家长、多孩子、主要联系人和反馈接收权限&lt;/td&gt;&lt;td&gt;保留，必要多对多表&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;code&gt;class_enrollment&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一名学员的一段入班记录&lt;/td&gt;&lt;td&gt;无法表达转班、退班、复班和历史班级归属&lt;/td&gt;&lt;td&gt;保留，必要关系历史表&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;code&gt;schema_version&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一次已应用的结构版本&lt;/td&gt;&lt;td&gt;每机构一库后，无法判断哪些机构库完成了哪次升级&lt;/td&gt;&lt;td&gt;保留，物理治理表&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

    &lt;h3 class=&quot;dmc-table-title&quot;&gt;18张表的主外键登记册&lt;/h3&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;序号&lt;/th&gt;&lt;th&gt;表&lt;/th&gt;&lt;th&gt;粒度&lt;/th&gt;&lt;th&gt;主键&lt;/th&gt;&lt;th&gt;主要外键&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;&lt;code&gt;schema_version&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一个结构版本&lt;/td&gt;&lt;td&gt;&lt;code&gt;version_no&lt;/code&gt;&lt;/td&gt;&lt;td&gt;-&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;&lt;code&gt;family&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一个家庭&lt;/td&gt;&lt;td&gt;&lt;code&gt;family_id&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;owner_staff_id&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;&lt;code&gt;guardian&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一名家长&lt;/td&gt;&lt;td&gt;&lt;code&gt;guardian_id&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;family_id&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;&lt;code&gt;student&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一名学员&lt;/td&gt;&lt;td&gt;&lt;code&gt;student_id&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;family_id&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;&lt;code&gt;student_guardian&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一条学员家长关系&lt;/td&gt;&lt;td&gt;&lt;code&gt;student_id + guardian_id&lt;/code&gt;&lt;/td&gt;&lt;td&gt;学员、家长&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;&lt;code&gt;staff&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一名员工&lt;/td&gt;&lt;td&gt;&lt;code&gt;staff_id&lt;/code&gt;&lt;/td&gt;&lt;td&gt;-&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;7&lt;/td&gt;&lt;td&gt;&lt;code&gt;course&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一个课程产品&lt;/td&gt;&lt;td&gt;&lt;code&gt;course_id&lt;/code&gt;&lt;/td&gt;&lt;td&gt;-&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;8&lt;/td&gt;&lt;td&gt;&lt;code&gt;class_group&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一个教学班级&lt;/td&gt;&lt;td&gt;&lt;code&gt;class_id&lt;/code&gt;&lt;/td&gt;&lt;td&gt;课程、主教教师&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;9&lt;/td&gt;&lt;td&gt;&lt;code&gt;class_enrollment&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一段学员入班历史&lt;/td&gt;&lt;td&gt;&lt;code&gt;class_enrollment_id&lt;/code&gt;&lt;/td&gt;&lt;td&gt;班级、学员&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;10&lt;/td&gt;&lt;td&gt;&lt;code&gt;skill_point&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一个能力点&lt;/td&gt;&lt;td&gt;&lt;code&gt;skill_id&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;parent_skill_id&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;11&lt;/td&gt;&lt;td&gt;&lt;code&gt;learning_resource&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一个资源文件版本&lt;/td&gt;&lt;td&gt;&lt;code&gt;resource_id&lt;/code&gt;&lt;/td&gt;&lt;td&gt;-&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;12&lt;/td&gt;&lt;td&gt;&lt;code&gt;content_unit&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一个可复用内容单元&lt;/td&gt;&lt;td&gt;&lt;code&gt;content_unit_id&lt;/code&gt;&lt;/td&gt;&lt;td&gt;教学资源&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;13&lt;/td&gt;&lt;td&gt;&lt;code&gt;question&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一道原子题目&lt;/td&gt;&lt;td&gt;&lt;code&gt;question_id&lt;/code&gt;&lt;/td&gt;&lt;td&gt;内容单元、能力点&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;14&lt;/td&gt;&lt;td&gt;&lt;code&gt;assessment&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一次作业或测评&lt;/td&gt;&lt;td&gt;&lt;code&gt;assessment_id&lt;/code&gt;&lt;/td&gt;&lt;td&gt;课程、班级、创建人&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;&lt;code&gt;assessment_question&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一道题在一次作业中的使用&lt;/td&gt;&lt;td&gt;&lt;code&gt;assessment_question_id&lt;/code&gt;&lt;/td&gt;&lt;td&gt;测评、题目&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;16&lt;/td&gt;&lt;td&gt;&lt;code&gt;assessment_attempt&lt;/code&gt;&lt;/td&gt;&lt;td&gt;一名学员的一次提交&lt;/td&gt;&lt;td&gt;&lt;code&gt;attempt_id&lt;/code&gt;&lt;/td&gt;&lt;td&gt;测评、学员、评分人&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;17&lt;/td&gt;&lt;td&gt;&lt;code&gt;student_answer&lt;/code&gt;&lt;/td&gt;&lt;td&gt;学员对一道题的最终答案&lt;/td&gt;&lt;td&gt;&lt;code&gt;answer_id&lt;/code&gt;&lt;/td&gt;&lt;td&gt;提交、测评题目、评分人&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;18&lt;/td&gt;&lt;td&gt;&lt;code&gt;feedback&lt;/code&gt;&lt;/td&gt;&lt;td&gt;针对一次提交的一次反馈&lt;/td&gt;&lt;td&gt;&lt;code&gt;feedback_id&lt;/code&gt;&lt;/td&gt;&lt;td&gt;提交、家长、负责人&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

    &lt;h3 class=&quot;dmc-table-title&quot;&gt;关键关系链&lt;/h3&gt;
    &lt;div class=&quot;dmc-rule&quot;&gt;&lt;strong&gt;家庭链：&lt;/strong&gt; family → guardian／student → student_guardian。&lt;/div&gt;
    &lt;div class=&quot;dmc-rule&quot;&gt;&lt;strong&gt;班级链：&lt;/strong&gt; course → class_group → class_enrollment → student。&lt;/div&gt;
    &lt;div class=&quot;dmc-rule&quot;&gt;&lt;strong&gt;作业链：&lt;/strong&gt; learning_resource → content_unit → question → assessment_question → assessment。&lt;/div&gt;
    &lt;div class=&quot;dmc-rule&quot;&gt;&lt;strong&gt;结果链：&lt;/strong&gt; student → assessment_attempt → student_answer → feedback → guardian。&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;dmc-section&quot; data-panel=&quot;example&quot;&gt;
    &lt;h2&gt;5. 一个学员实例：从测评到反馈&lt;/h2&gt;
    &lt;p class=&quot;dmc-caption&quot;&gt;以下用真实 Level D 阅读作业的“Look Out!”单元展示编号怎样从PDF来源贯穿到家长反馈。&lt;/p&gt;
    &lt;div class=&quot;dmc-story&quot;&gt;
      &lt;div class=&quot;dmc-step&quot;&gt;&lt;strong&gt;① 拆解资源&lt;/strong&gt;&lt;span&gt;&lt;code&gt;RES001&lt;/code&gt; 中建立内容单元 &lt;code&gt;CU001&lt;/code&gt;。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;dmc-step&quot;&gt;&lt;strong&gt;② 布置作业&lt;/strong&gt;&lt;span&gt;&lt;code&gt;HW001&lt;/code&gt; 引用 &lt;code&gt;CU001&lt;/code&gt; 下的题目。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;dmc-step&quot;&gt;&lt;strong&gt;③ 学员提交&lt;/strong&gt;&lt;span&gt;学员 &lt;code&gt;S001&lt;/code&gt; 产生作业记录 &lt;code&gt;T001&lt;/code&gt; 和逐题答案。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;dmc-step&quot;&gt;&lt;strong&gt;④ 形成反馈&lt;/strong&gt;&lt;span&gt;根据 &lt;code&gt;T001&lt;/code&gt; 生成反馈 &lt;code&gt;F001&lt;/code&gt;。&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;dmc-rule&quot;&gt;&lt;strong&gt;完整追溯链：&lt;/strong&gt; PDF &lt;code&gt;RES001&lt;/code&gt; → 阅读单元 &lt;code&gt;CU001&lt;/code&gt; → 题目 → 作业 &lt;code&gt;HW001&lt;/code&gt; → 学员提交 &lt;code&gt;T001&lt;/code&gt; → 逐题答案 → 能力点 → 反馈 &lt;code&gt;F001&lt;/code&gt;。&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
